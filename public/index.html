<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuietSpace — Study Room Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/x-icon" href="/QS_logo.jpg" />
</head>
<body>
  <header>
    <div class="header-left">
      <a href="index.html"><img src="QS_logo.jpg" alt="QuietSpace" class="header-logo" onerror="this.style.display='none'" /></a>
      <div class="brand-text">
        <h1>QuietSpace</h1>
        <p class="tag">Find a room. Now.</p>
      </div>
    </div>
    <div class="header-right">
      <div>
        <div class="clock-time" id="clock">--:--</div>
        <div class="clock-date" id="clock-date"></div>
      </div>
      <span id="last-refresh" class="refresh-label"></span>
      <a href="admin.html" class="staff-link">Staff →</a>
    </div>
  </header>

  <section class="stat-strip">
    <div class="stat stat-open">
      <div class="stat-num" id="stat-open">—</div>
      <div class="stat-label">Available</div>
    </div>
    <div class="stat stat-empty">
      <div class="stat-num" id="stat-empty">—</div>
      <div class="stat-label">Empty</div>
    </div>
    <div class="stat stat-meeting">
      <div class="stat-num" id="stat-meeting">—</div>
      <div class="stat-label">In Meeting</div>
    </div>
  </section>

  <main>
    <div class="search-bar-wrap">
      <input
        type="search"
        id="search-input"
        placeholder="Search by room number or teacher name…"
        autocomplete="off"
      />
    </div>
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">Floor</span>
        <div class="filter-bar" id="floor-filters">
          <button class="filter-btn active" data-floor="all">All</button>
          <button class="filter-btn" data-floor="2">2nd</button>
          <button class="filter-btn" data-floor="3">3rd</button>
          <button class="filter-btn" data-floor="4">4th</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Status</span>
        <div class="filter-bar" id="status-filters">
          <button class="filter-btn active" data-status="all">All</button>
          <button class="filter-btn" data-status="open">Available</button>
          <button class="filter-btn" data-status="closed">Empty</button>
          <button class="filter-btn" data-status="meeting">Meeting</button>
        </div>
      </div>
    </div>
    <div id="room-grid" class="room-grid">
      <p class="loading">Loading rooms…</p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
