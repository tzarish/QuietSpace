<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuietSpace — Staff Access</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/x-icon" href="/QS_logo.jpg" />
</head>
<body class="admin-body">
  <header>
    <div class="header-left">
      <a href="index.html"><img src="QS_logo.jpg" alt="QuietSpace" class="header-logo" onerror="this.style.display='none'" /></a>
      <p class="tagline">Staff Console</p>
    </div>
    <div class="header-right" id="teacher-info" style="display:none">
      <span id="teacher-name-label" class="teacher-badge"></span>
      <button id="logout-btn" class="btn btn-ghost">Log out</button>
    </div>
  </header>

  <main>
    <!-- Login gate (kept simple) -->
    <div id="login-screen" class="login-screen">
      <div class="login-card">
        <h2>Staff Access</h2>
        <p>Enter your personal staff password to manage room availability.</p>
        <form id="login-form">
          <input
            type="password"
            id="password-input"
            placeholder="Your password"
            autocomplete="current-password"
            required
          />
          <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
        <p id="login-error" class="error-msg hidden">Incorrect password. Try again.</p>
        <a href="index.html" class="back-link">← Back to student view</a>
      </div>
    </div>

    <!-- Admin panel: sidebar + main -->
    <div id="admin-panel" class="admin-shell hidden">
      <aside class="admin-sidebar">
        <div class="sidebar-section">
          <div class="sidebar-section-title">Floor</div>
          <div class="sidebar-list" id="floor-filters">
            <button class="sidebar-btn active" data-floor="all">All Floors <span class="count" id="count-all">0</span></button>
            <button class="sidebar-btn" data-floor="2">2nd Floor <span class="count" id="count-2">0</span></button>
            <button class="sidebar-btn" data-floor="3">3rd Floor <span class="count" id="count-3">0</span></button>
            <button class="sidebar-btn" data-floor="4">4th Floor <span class="count" id="count-4">0</span></button>
          </div>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-title">Status</div>
          <div class="sidebar-list" id="status-filters">
            <button class="sidebar-btn active" data-status="all">All</button>
            <button class="sidebar-btn" data-status="open">Available</button>
            <button class="sidebar-btn" data-status="closed">Empty</button>
            <button class="sidebar-btn" data-status="meeting">Meeting</button>
          </div>
        </div>
      </aside>

      <section class="admin-main">
        <div class="admin-main-header">
          <div>
            <div class="admin-main-title">Room Control</div>
            <div class="admin-main-subtitle" id="admin-main-subtitle">—</div>
          </div>
        </div>
        <div id="admin-room-list" class="admin-room-list">
          <p class="loading">Loading rooms…</p>
        </div>
      </section>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
